[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bijlibachat-backend"
version = "0.1.0"
description = "BijliBachat AI API. Data contracts are defined. Tariff calculations are not implemented."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  # Starlette's TestClient imports httpx2. Plain httpx still runs, and Starlette warns that it is deprecated for this client.
  "httpx2>=2,<3",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
