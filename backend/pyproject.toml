[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bijlibachat-backend"
version = "0.1.0"
description = "BijliBachat AI API. Dated tariff files, a Decimal calculation engine, and Gemini bill extraction are included. A payable total is produced only when every required component is verified."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "firebase-admin>=6.6,<7",
  "google-genai>=1.75,<2",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  # Starlette's TestClient imports httpx2. Plain httpx still runs, and Starlette warns that it is deprecated for this client.
  "httpx2>=2,<3",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.tariffs" = ["configs/*.json", "availability.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
